name: CI

on: [push, pull_request]

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install source and test dependencies
        run: |
          python -m pip install "pip==26.2.1"
          python -m pip install -c requirements.lock -e ".[dev]"
      - name: Static checks
        run: python -m ruff check .
      - name: QML static checks
        shell: pwsh
        run: |
          $files = @(Get-ChildItem src\voxweave\qml -Filter *.qml | ForEach-Object { $_.FullName })
          $output = @(& pyside6-qmllint @files 2>&1)
          $output | ForEach-Object { Write-Host $_ }
          if ($LASTEXITCODE -ne 0 -or @($output | Where-Object { $_ -match '^Warning: ' }).Count -gt 0) {
            exit 1
          }
      - name: Unit and CPU contract tests
        env:
          QT_QPA_PLATFORM: offscreen
          VOXWEAVE_HOME: "${{ runner.temp }}/VoxWeave"
        run: python -m pytest
      - name: Compile Python sources
        run: python -m compileall -q src tests
